name: helix-atlas-local

services:
  helixdb:
    # HelixDB v3.5.1 + atlas-mutation-v1, built locally (see docker/helixdb-atlas).
    image: helix-atlas/helixdb:v3.5.1-atlas-mutation-v1
    build:
      context: ./docker/helixdb-atlas
      additional_contexts:
        contracts: ./contracts/helixdb-v2
    container_name: helix-atlas-db
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:6969:8080"
    environment:
      HELIX_HTTP_ADDR: "0.0.0.0:8080"
      HELIX_GRPC_ADDR: "127.0.0.1:8081"
      HELIX_DATA_DIR: "/var/lib/helix"
      DB_PATH: "atlas/"
      RUST_LOG: "server=info,db=info,slatedb=info"
    volumes:
      - helix-data:/var/lib/helix

volumes:
  helix-data:
    # The previous v0.0.6 data stays in the separate `helix-atlas-data` volume.
    name: helix-atlas-data-v3
